[package]
name = "alcor-pro"
version = "0.1.0"
description = "Alcor Pro — AI-native video editor for Windows"
license = "GPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "alcor_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
uuid = { version = "1.29.2", features = ["v4"] }
tokio = { version = "1.54.1", features = ["sync", "time", "net", "fs", "io-util", "macros", "rt"] }
tokio-util = { version = "0.7.20", features = ["io"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
bytes = "1.12.1"
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
